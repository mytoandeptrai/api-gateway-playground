name: api-gateway-playground

# Run all services: docker compose -f docker/docker-compose.yml up -d --build
# Infra only (dev):  docker compose -f docker/docker-compose-infra.yml up -d

networks:
  app_net:
    driver: bridge

# ─── Shared logging config (anchor) ──────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ─── Shared NestJS resource limits (anchor) ──────────────────────────────────
x-nestjs-resources: &nestjs-resources
  limits:
    cpus: "0.50"
    memory: 512M

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: api-gw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api-gateway-db
    ports:
      - "1111:5432"
    volumes:
      - ./volumes-production/postgres_data:/var/lib/postgresql/data
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: api-gw-redis
    restart: unless-stopped
    ports:
      - "1112:6379"
    volumes:
      - ./volumes-production/redis_data:/data
    networks: [app_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: api-gw-mailpit
    restart: unless-stopped
    ports:
      - "1113:1025"
      - "1114:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: api-gw-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:1115
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "1115:9092"
    volumes:
      - ./volumes-production/kafka_data:/var/lib/kafka/data
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: api-gw-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "1116:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: api-gw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "1117:9000"
      - "1118:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes-production/minio_data:/data
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # Build context is the monorepo root (..)
  # ═══════════════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gw-gateway
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file: ../apps/api-gateway/.env
    environment:
      PORT: "3002"
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: api-gw-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: ../apps/api/.env
    environment:
      PORT: "3001"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  auth-service:
    build:
      context: ..
      dockerfile: apps/auth-service/Dockerfile
    container_name: api-gw-auth
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file: ../apps/auth-service/.env
    environment:
      PORT: "3003"
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  product-service:
    build:
      context: ..
      dockerfile: apps/product-service/Dockerfile
    container_name: api-gw-product
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file: ../apps/product-service/.env
    environment:
      PORT: "3005"
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  order-service:
    build:
      context: ..
      dockerfile: apps/order-service/Dockerfile
    container_name: api-gw-order
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file: ../apps/order-service/.env
    environment:
      PORT: "3006"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:3005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  inventory-service:
    build:
      context: ..
      dockerfile: apps/inventory-service/Dockerfile
    container_name: api-gw-inventory
    restart: unless-stopped
    ports:
      - "3007:3007"
    env_file: ../apps/inventory-service/.env
    environment:
      PORT: "3007"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  payment-service:
    build:
      context: ..
      dockerfile: apps/payment-service/Dockerfile
    container_name: api-gw-payment
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file: ../apps/payment-service/.env
    environment:
      PORT: "3008"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  shipping-service:
    build:
      context: ..
      dockerfile: apps/shipping-service/Dockerfile
    container_name: api-gw-shipping
    restart: unless-stopped
    ports:
      - "3009:3009"
    env_file: ../apps/shipping-service/.env
    environment:
      PORT: "3009"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  notification-service:
    build:
      context: ..
      dockerfile: apps/notification-service/Dockerfile
    container_name: api-gw-notification
    restart: unless-stopped
    ports:
      - "3010:3010"
    env_file: ../apps/notification-service/.env
    environment:
      PORT: "3010"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      MAIL_HOST: mailpit
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  refund-service:
    build:
      context: ..
      dockerfile: apps/refund-service/Dockerfile
    container_name: api-gw-refund
    restart: unless-stopped
    ports:
      - "3011:3011"
    env_file: ../apps/refund-service/.env
    environment:
      PORT: "3011"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  orchestrator-service:
    build:
      context: ..
      dockerfile: apps/orchestrator-service/Dockerfile
    container_name: api-gw-orchestrator
    restart: unless-stopped
    ports:
      - "3012:3012"
    env_file: ../apps/orchestrator-service/.env
    environment:
      PORT: "3012"
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      ORDER_SERVICE_URL: http://order-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3008
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources: *nestjs-resources

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Server-side rewrite: Next.js container → API Gateway container
        API_GATEWAY_URL: http://api-gateway:3002
        # Client-side WebSocket: browser → host machine (port published to host)
        NEXT_PUBLIC_WS_URL: http://localhost:3010
    container_name: api-gw-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [app_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
