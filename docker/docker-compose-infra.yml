services:
  # Local infra host ports: sequential 1111–1118 (see README)
  #
  # 1111 PostgreSQL | 1112 Redis | 1113 Mailpit SMTP | 1114 Mailpit UI
  # 1115 Kafka      | 1116 Kafka UI | 1117 MinIO API | 1118 MinIO Console

  # PostgreSQL Database
  # Pin major + alpine — tránh :latest, image nhẹ hơn
  postgres:
    image: postgres:16-alpine
    container_name: api-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api-gateway-db
    ports:
      - "1111:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  # Pin major + alpine
  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    restart: unless-stopped
    ports:
      - "1112:6379"
    volumes:
      - ./volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (Local email testing)
  # Pin version — tag trên Docker Hub dạng semver (vd. 1.30.1), không có prefix "v"
  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: api-gateway-mailpit
    restart: unless-stopped
    ports:
      - "1113:1025"  # SMTP
      - "1114:8025"  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Kafka (KRaft mode — không cần Zookeeper)
  # Confluent không ship bản alpine; giữ tag cố định thay vì latest
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: api-gateway-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:1115
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "1115:9092"
    volumes:
      - ./volumes/kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka UI — web console xem topics, messages, consumer groups
  # Pin version — image JRE-based, không có variant alpine chính thức
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: api-gateway-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "1116:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # MinIO — S3-compatible object storage (upload file, avatar, backup, ...)
  # Pin RELEASE tag — minio/minio là single binary (scratch-based), không có tag alpine
  #
  # minio-bucket (init sidecar) — CÓ CẦN KHÔNG?
  # → Không bắt buộc. MinIO chạy độc lập, không cần service phụ để hoạt động.
  #
  # minio-bucket là gì?
  # → Container one-shot dùng image minio/mc (MinIO Client), chạy sau khi MinIO healthy
  #   để tự tạo bucket (vd. uploads, assets) bằng lệnh: mc mb local/my-bucket
  #
  # Bucket là gì?
  # → "Container" cấp cao nhất trong S3/MinIO — giống root folder chứa objects.
  #   MinIO mới start không có bucket nào; app upload vào bucket phải tồn tại trước.
  #
  # Khi nào nên thêm minio-bucket?
  # → Khi app expect bucket name cố định ngay lúc docker compose up (tránh 404 NoSuchBucket).
  # → Dev solo: có thể tạo bucket tay qua Console (http://localhost:1118) — đủ dùng.
  # → Team/CI: nên thêm init sidecar để môi trường reproducible, không phụ thuộc thao tác tay.
  # Jaeger — distributed tracing UI + OTLP collector
  # 1119 = Jaeger UI | 4318 = OTLP HTTP receiver
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: api-gateway-jaeger
    restart: unless-stopped
    ports:
      - "1119:16686"  # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: api-gateway-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "1117:9000"  # S3 API
      - "1118:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio_data:/data

  # Prometheus — scrape metrics từ tất cả services mỗi 15s
  # 1120 = Prometheus UI
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: api-gateway-prometheus
    restart: unless-stopped
    ports:
      - "1120:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volumes/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana — dashboard visualization
  # 1121 = Grafana UI (admin/admin)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: api-gateway-grafana
    restart: unless-stopped
    ports:
      - "1121:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./volumes/grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data: