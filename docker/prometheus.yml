      - target_label: instance
        replacement: shipping-service

  - job_name: notification-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3010']
    relabel_configs:
      - target_label: instance
        replacement: notification-service

  - job_name: refund-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3011']
    relabel_configs:
      - target_label: instance
        replacement: refund-service

  - job_name: orchestrator-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3012']
    relabel_configs:
      - target_label: instance
        replacement: orchestrator-service
