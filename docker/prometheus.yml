global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3002']
    relabel_configs:
      - target_label: instance
        replacement: api-gateway

  - job_name: auth-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3003']
    relabel_configs:
      - target_label: instance
        replacement: auth-service

  - job_name: product-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3005']
    relabel_configs:
      - target_label: instance
        replacement: product-service

  - job_name: order-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3006']
    relabel_configs:
      - target_label: instance
        replacement: order-service

  - job_name: inventory-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3007']
    relabel_configs:
      - target_label: instance
        replacement: inventory-service

  - job_name: payment-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3008']
    relabel_configs:
      - target_label: instance
        replacement: payment-service

  - job_name: shipping-service
    metrics_path: /api/v1/metrics
